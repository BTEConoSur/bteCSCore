# Cooldowns por comando (En segundos). En caso de no especificar, se usa el valor por defecto. 
# Nota: El cooldown es por cada comando/subcomando. Es decir, si se especifica un cooldown para "btecs" y otro para "btecs test", ambos se aplican independientemente.
# Por lo que el cooldown de btecs no afecta al de btecs test y el resto de subcomandos. 
default-cooldown: 5
commands-cooldowns:
  btecs: 10
  btecs.test: 200
  nightvision: 0

ds-help-command-per-page: 5 # Cantidad de comandos a mostrar por página en el comando de ayuda de Discord.
ds-project-list-per-page: 9 # Cantidad de proyectos a mostrar por página en el comando de listado de proyectos de Discord por usuario.
help-command-per-page: 5 # Cantidad de comandos a mostrar por página en el comando de ayuda.
help-command-cooldown: 0 # Cooldown para el comando de ayuda (en segundos).
pwarp-list-per-page: 10 # Cantidad de pwarps a mostrar por página en el comando de listado.
pwarp-list-cooldown: 0 # Cooldown para el comando de listado de pwarps (en segundos).

commands-aliases:
  scoreboard:
    aliases: ["sb"]
  help:
    aliases: ["ayuda"]
  btecs:
    aliases: ["bteconosur"]
    test:
      aliases: ["t", "ts", "tst"]
      simplemenu.aliases: ["menusimple", "menu"]
  project:
    aliases: ["proyecto", "p"]
    accept.aliases: ["aceptar"]
  pais:
    aliases: ["paisprefix", "prefix"]
  language:
     aliases: ["lang", "idioma"]
  nightvision:
    aliases: ["nv", "vn"]

# TAB
tab-reload: 100 # Cada cuantos milisegundos se refresca el TAB.
current-tip-rotation: 10 # Cada cuantos segundos rota el tip actual en el TAB.

# Scoreboard
scoreboard-rotation: 10 # Cada cuantos segundos rota la scoreboard.
proyecto-scoreboard-refresh: 2 # Cada cuantos segundos refresca la scoreboard de proyectos.
online-scoreboard-refresh: 3 # Cada cuantos segundos refresca la scoreboard de jugadores online.

# Configuración de Players
player-defaults:
  general:
    global-chat-on-join: true
    simultaneous-notifications: true
    pais-border: true
    label-border: true
    project-title: true
    scoreboard: true
  scoreboard:
    player: true
    online: true
    proyecto: true
  reviewer:
    ds-notifications: true
  manager:
    ds-notifications: true

# Configuración de Proyectos
max-members-for-postulantes: 1 # Cantidad máxima de miembros que un usuario con rango Postulante puede agregar a sus proyectos.
id-proyecto-admin: 5

# Resource Pack
rp-required: true

# Web
api-manager-enabled: true # Habilitar/deshabilitar el ApiManager para sincronizar con la web. Requiere reiniciar el servidor para aplicar cambios.
web-debug-mode: true
web-pending-sync-enabled: true # Activar/desactivar el task de sincronización periódica de pendientes.

web-claim-create-url: "https://api.buildtheearth.net/api/v1/public/buildteams/%buildteam%/claims?coordType=array" # Endpoint para crear claims.
web-claim-update-url: "https://api.buildtheearth.net/api/v1/public/buildteams/%buildteam%/claims/%claimid%?coordType=array&external=true" # Endpoint para actualizar claims.
web-claim-delete-url: "https://api.buildtheearth.net/api/v1/public/buildteams/%buildteam%/claims/%claimid%?external=true" # Endpoint para eliminar claims por ID externa sin body.
web-claim-get-url: "https://api.buildtheearth.net/api/v1/public/buildteams/%buildteam%/claims/%claimid%?coordType=array&external=true"
web-claim-connect-timeout: 8000 # Timeout de conexión para requests a la web (en milisegundos).
web-claim-read-timeout: 10000 # Timeout de lectura para requests a la web

web-pending-sync-interval: 6 # Cada cuantas horas se reintenta la sincronización de los proyectos pendientes con la web.
web-load-interval: 60 # Cada cuantos segundos se envían datos a la web.
web-consecutive-pending-failures: 5 # Cantidad de fallos consecutivos al intentar sincronizar proyectos.

# Chat y nombres
enable-banned-chars: true # Habilitar la validación de caracteres prohibidos en nombres de proyectos, managers, pwarps y nicknames.
