help-visitar:  # En cualquier línea se puede usar %plugin-prefix%
  using-coords:
    - "\n<dark_gray>+---------------------------------------+</dark_gray>"
    - "<gold>Visita un lugar ingresando sus coordenadas</gold>"
    - "Comando: <blue><i>/tpll <lat> <long></i></blue> <red><yellow><b><hover:show_text:'Puedes obtener las coordenadas con click derecho en Google Maps.'>🛈</hover></b></yellow></red>"
    - "Ejemplo: <blue><i>/tpll -33.44433846551859, -70.65359965216298</i></blue>"
    - "<dark_gray>+---------------------------------------+</dark_gray>\n"
  using-address:
    - "\n<dark_gray>+---------------------------------------+</dark_gray>"
    - "<gold>Visita cualquier lugar ingresando su dirección</gold>"
    - "Comando: <blue><i>/tpdir <lugar o dirección></i></blue>"
    - "Ejemplo: <blue><i>/tpdir Obelisco, Buenos Aires</i></blue> o"
    - "<blue><i>/tpdir Av. Corrientes 1047, Buenos Aires, Argentina</i></blue>"
    - "<dark_gray>+---------------------------------------+</dark_gray>\n"
  tour:
    - "\n<dark_gray>+---------------------------------------+</dark_gray>"
    - "<gold>Realiza un recorrido por construcciones icónicas</gold>"
    - "Tours disponibles: <blue><i>/tour list</i></blue>"
    - "Iniciar un tour: <blue><i>/tour <tour></i></blue>"
    - "Ejemplo: <blue><i>/tour peru</i></blue>"
    - "<dark_gray>+---------------------------------------+</dark_gray>\n"
  warps:
    - "\n<dark_gray>+---------------------------------------+</dark_gray>"
    - "<gold>Visita lugares construidos</gold>"
    - "Warps disponibles: <blue><i>/warp</i></blue> <yellow><b><hover:show_text:'Notar que todos los warps siguen el mismo formato, dependiendo de dónde se encuentran'>🛈</hover></b></yellow>"
    - "Ir a un warp: <blue><i>/warp <warp></i></blue>"
    - "Ejemplos: <blue><i>/warp ar.sf.rosario_Centro</i></blue>"
    - "<blue><i>/warp pe.lim_PlazaDeArmas</i></blue>"
    - "<dark_gray>+---------------------------------------+</dark_gray>\n"

